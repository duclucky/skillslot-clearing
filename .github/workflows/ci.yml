name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Python checks
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Verify contract, tooling, and frontend
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: npm run check
